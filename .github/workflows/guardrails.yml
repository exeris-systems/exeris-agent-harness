# The organisation's shared enforcement, called from this repository — ADR-085 §C.11 places the
# rules in `exeris-systems/.github` and leaves each repository one file that names what is
# checked here and what this repository adds. The gates are pinned to `@main` on purpose: the
# organisation's rules move as one, and a caller pinned to a commit is a caller that stopped
# being reviewed by them.
#
# Permissions sit at the workflow level because a reusable workflow may request no more than its
# caller holds, and the review half needs `id-token: write` for the OIDC exchange the runner
# performs, `issues: read` for the notices it reads back, and `actions: read` for the artefact the
# judge reads once the pull request has closed.
name: guardrails

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled, closed]

concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' && !endsWith(github.actor, '[bot]') }}

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
  actions: read

jobs:
  docs:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/docs-lint.yml@main
    with:
      mode: ramp                # switch to strict per repo once the frontmatter backfill has landed
      section-check: false      # enable after subsystem/module pages carry the required sections

  commits:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/commit-lint.yml@main

  pr-body:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/pr-body-check.yml@main

  # The L2 review, published: `publish: true` makes the verdict job the required check, red when
  # the verdict is red and red when no verdict exists, so a pull request is never green by the
  # absence of a review. `repo-routine` is this repository's own step of the review and
  # `repo-checks` is what the reviewer reads as REPOSITORY CHECK OUTPUT — the whole unit suite,
  # because a rule of this repository is a rule with a case that can fail.
  docs-review:
    needs: [docs, commits, pr-body]
    if: ${{ always() && github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/docs-review.yml@main
    with:
      publish: true
      l1-results: >-
        {"docs-lint": "${{ needs.docs.result }}",
         "commit-lint": "${{ needs.commits.result }}",
         "pr-body-check": "${{ needs.pr-body.result }}"}
      repo-routine: docs/repo-review-rules.md
      repo-checks: python3 -m unittest discover -s tests -p '*_test.py'
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}

  # Once the pull request has closed, what became of each finding is read from its history and
  # appended beside the run record as a judgement (ADR-087 §C.16).
  judge:
    if: ${{ github.event.action == 'closed' }}
    uses: exeris-systems/.github/.github/workflows/judge-review.yml@main
    secrets:
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}
